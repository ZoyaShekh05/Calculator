            <div>

                <p class="text-[9px]

                    text-cyan-400
                    font-bold">
                    SMART

                <h1 class="text-lg
                    font-bold

                    Calculator

            </div>

            <div class="w-9 h-9

                border border-fuchsia-400/20
                flex items-center
                justify-center

        </div>


        <!-- History Panel -->

        <!-- Display -->

        <div class="h-[105px]
            bg-[#080b12]

            rounded-[20px]

            border border-cyan-400/10

            p-4

            mb-4

            flex flex-col
            justify-end
            items-end

            shadow-inner">


            <div id="previous" class="text-cyan-300/40
                text-xs
                mb-1">
            </div>


            <div id="display" class="text-white
    text-[42px]
    font-bold
    tracking-tight
    whitespace-nowrap
    max-w-full
    text-right
    overflow-hidden">
                0
            </div>

        </div>


        <!-- Buttons -->

        <div id="buttons" class="grid grid-cols-4 gap-2.5">


            <!-- AC / Delete -->

            <button class="calc-btn clear col-span-2">
                AC
            </button>

            <button class="calc-btn delete">
                ⌫
            </button>

            <button class="calc-btn operator">
                ÷
            </button>


            <!-- 7 8 9 -->

            <button class="calc-btn number">7</button>
            <button class="calc-btn number">8</button>
            <button class="calc-btn number">9</button>

            <button class="calc-btn operator">
                ×
            </button>


            <!-- 4 5 6 -->

            <button class="calc-btn number">4</button>
            <button class="calc-btn number">5</button>
            <button class="calc-btn number">6</button>

            <button class="calc-btn operator">
                −
            </button>


            <!-- 1 2 3 -->

            <button class="calc-btn number">1</button>
            <button class="calc-btn number">2</button>
            <button class="calc-btn number">3</button>

            <button class="calc-btn operator">
                +
            </button>


            <!-- Bottom -->

            <button class="calc-btn special">
                ±
            </button>

            <button class="calc-btn number">
                0
            </button>

            <button class="calc-btn number">
                .
            </button>

            <button class="calc-btn equal">
                =
            </button>


            <!-- Extra -->

            <!-- <button class="calc-btn history col-span-2">
                🕘 History
            </button> -->

            <button class="calc-btn percent">
                %
            </button>

            <!-- <button class="calc-btn percent">
                →
            </button> -->

        </div>


        <!-- Footer -->

        <p class="text-center
            text-[8px]
            text-white/20
            tracking-[0.35rem]
            mt-4">
            ZOYA • SMART CALCULATOR
        </p>

    </div>


    <!-- Button CSS -->

    <style>
        .calc-btn {

            height: 48px;

            border-radius: 13px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
            font-weight: 600;

            transition:
                0.18s ease;

            user-select: none;
        }


        /* Numbers */

        .number {

            background: #1b2030;

            color: #ffffff;

            border: 1px solid #292f42;
        }

        .number:hover {

            background: #252c40;

            border-color: #6d5dfc;

            color: #c4b5fd;

            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(99, 102, 241, 0.15);
        }


        /* Operators */

        .operator {

            background:
                #27204a;

            color: #c4b5fd;

            border: 1px solid #49378a;
        }

        .operator:hover {

            background:
                #3a2d68;

            color: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(139, 92, 246, 0.25);
        }


        /* AC */

        .clear {

            background:
                #3b1725;

            color: #fb7185;

            border: 1px solid #6b263d;
        }

        .clear:hover {

            background:
                #542034;

            transform: translateY(-2px);
        }


        /* Delete */

        .delete {

            background:
                #302118;

            color: #fb923c;

            border: 1px solid #5a3925;
        }

        .delete:hover {

            background:
                #4a2d1d;

            transform: translateY(-2px);
        }


        /* Plus Minus */

        .special {

            background:
                #102d32;

            color: #67e8f9;

            border: 1px solid #1b555d;
        }

        .special:hover {

            background:
                #164047;

            transform: translateY(-2px);
        }


        /* Equal */

        .equal {

            background:
                linear-gradient(135deg,
                    #d946ef,
                    #7c3aed);

            color: white;

            border: 1px solid #e879f9;

            box-shadow:
                0 7px 22px rgba(217, 70, 239, 0.3);
        }

        .equal:hover {

            transform:
                translateY(-2px) scale(1.02);

            box-shadow:
                0 10px 28px rgba(217, 70, 239, 0.45);
        }


        /* History */

        .history {

            background:
                #151b2a;

            color: #67e8f9;

            border: 1px solid #26364b;

            font-size: 13px;
        }

        .history:hover {

            background:
                #1d273a;

            transform:
                translateY(-2px);
        }


        /* Percentage */

        .percent {

            background:
                #171d2c;

            color: #a5b4fc;

            border: 1px solid #29334a;

            font-size: 16px;
        }

        .percent:hover {

            background:
                #222b40;

            transform:
                translateY(-2px);
        }


        /* Click */

        .calc-btn:active {

            transform:
                scale(0.92);
        }


        /* Small screen */

        @media (max-height: 650px) {

            .calc-btn {
                height: 42px;
            }

            #calculator {
                padding: 13px;
            }

            #buttons {
                gap: 7px;
            }

        }


        @media (max-width: 360px) {

            .calc-btn {
                height: 44px;
                font-size: 15px;
            }

        }
    </style>
    <script src="index.js"></script>

</body>

</html>
